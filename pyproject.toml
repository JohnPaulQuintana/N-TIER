[project]
name = "python-n-tier"
version = "0.1.0"
description = "Python N-tier backend training project"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "email-validator",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = [
    "api*",
    "models*",
    "configs*",
    "schemas*",
    "database*",
    "services*",
    "repositories*",
    "utils*",
]